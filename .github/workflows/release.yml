name: Publish Windows UE4SS mod
run-name: Windows UE4SS mod release from VERSION
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the release as a draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ue4ss-mod-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: EnoPM/BriefcaseNative
          ref: v0.8.5
          path: framework
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: framework/repositories/Briefcase.PregameTimer
          persist-credentials: false
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content framework/repositories/Briefcase.PregameTimer/VERSION -Raw).Trim()
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw 'Invalid mod VERSION.' }
          "MOD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install tested Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Fetch pinned UE4SS dependencies
        shell: pwsh
        env:
          UPSTREAM_READ_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
        run: |
          if (-not $env:UPSTREAM_READ_TOKEN) { throw 'UPSTREAM_READ_TOKEN is required for the gated Unreal submodule.' }
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:UPSTREAM_READ_TOKEN))
          Write-Output "::add-mask::$encoded"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + $encoded
          ./framework/scripts/build/Fetch-Dependencies.ps1
      - name: Build and test Windows mod
        shell: pwsh
        run: |
          ./framework/scripts/ue4ss/Build-ServerMods.ps1 -BuildDirectory ./framework/build-ue4ss-ninja -ModTargets 'Briefcase.PregameTimer.UE4SS'
          if ($LASTEXITCODE) { throw 'UE4SS mod build failed.' }
          ctest --test-dir ./framework/build-ue4ss-ninja -R 'Briefcase.DeceiveInc.Contracts' --output-on-failure
          if ($LASTEXITCODE) { throw 'Mod tests failed.' }
      - name: Package and publish verified mod
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          $archive = ./framework/scripts/ue4ss/Package-ServerMod.ps1 -RepositoryName Briefcase.PregameTimer -InstallName briefcasepregametimer -BuildDirectory ./framework/build-ue4ss-ninja
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $license = 'framework/repositories/Briefcase.PregameTimer/LICENSE'
          $zip = [IO.Compression.ZipFile]::Open($archive, [IO.Compression.ZipArchiveMode]::Update)
          try {
            if (-not $zip.GetEntry('ue4ss/Mods/briefcasepregametimer/LICENSE')) {
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $license, 'ue4ss/Mods/briefcasepregametimer/LICENSE') | Out-Null
            }
          } finally { $zip.Dispose() }
          $draft = $env:RELEASE_DRAFT -eq 'true'
          $version = (Get-Content framework/repositories/Briefcase.PregameTimer/VERSION -Raw).Trim()
          $catalogPath = Join-Path (Split-Path $archive -Parent) 'catalog.json'
          $catalog = [ordered]@{
            schemaVersion = 2
            mods = @([ordered]@{
              id = 'briefcasepregametimer'
              name = 'Pregame Timer'
              description = 'Configure the dedicated server lobby countdown before a match starts.'
              version = $version
              author = 'EnoPM'
              downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/$(Split-Path $archive -Leaf)"
              archiveSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              documentationUrl = "https://github.com/$env:GITHUB_REPOSITORY#readme"
              homepageUrl = "https://github.com/$env:GITHUB_REPOSITORY"
            })
          }
          [IO.File]::WriteAllText($catalogPath, ($catalog | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          ./framework/scripts/ue4ss/Publish-ServerMod.ps1 -RepositoryName Briefcase.PregameTimer -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -Archive $archive -Draft
          gh release upload "v$version" $catalogPath --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { throw 'Failed to upload PregameTimer marketplace catalog.' }
          $releaseApi = gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json apiUrl --jq .apiUrl
          if ($LASTEXITCODE -or $releaseApi -notmatch '^https://api\.github\.com/repos/EnoPM/Briefcase\.PregameTimer/releases/[0-9]+$') {
            throw 'Cannot resolve PregameTimer draft release.'
          }
          $release = gh api $releaseApi | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot read PregameTimer draft release.' }
          $catalogAssets = @($release.assets | Where-Object { $_.name -ceq 'catalog.json' })
          $catalogHash = (Get-FileHash $catalogPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $release.draft -or $catalogAssets.Count -ne 1 -or
              $catalogAssets[0].digest -cne "sha256:$catalogHash") {
            throw 'PregameTimer marketplace catalog verification failed; release remains a draft.'
          }
          if (-not $draft) {
            gh release edit "v$version" --repo $env:GITHUB_REPOSITORY --draft=false --latest
            if ($LASTEXITCODE) { throw 'Failed to publish verified PregameTimer release.' }
          }
